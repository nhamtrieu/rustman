name: Release

# - Push a tag like v0.2.0: build every platform and publish a GitHub Release (marked latest).
# - Push to main: rebuild the "nightly" pre-release, whose download links never change.
# - Run by hand (Actions → Release → Run workflow): only build, keep files as workflow artifacts.
#
# Each platform ships a plain archive and an installer: .deb (Linux), .dmg (macOS), .msi (Windows).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # A newer push to main replaces a nightly build in progress; tag builds always finish.
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc requirement low so the binary runs on older distros too.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, installer: deb }
          - { target: aarch64-apple-darwin, os: macos-latest, installer: dmg, arch: arm64 }
          - { target: x86_64-apple-darwin, os: macos-latest, installer: dmg, arch: x64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, installer: msi }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Versions
        shell: bash
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            label=$GITHUB_REF_NAME; pkg=${GITHUB_REF_NAME#v}; deb=$pkg
          else
            label=nightly; pkg=$cargo_version; deb="${cargo_version}~nightly.${GITHUB_RUN_NUMBER}"
            [ "$GITHUB_EVENT_NAME" = push ] || label="dev-${GITHUB_SHA::7}"
          fi
          {
            echo "LABEL=$label"         # in file names: v0.2.0, nightly, dev-abc1234
            echo "PKG_VERSION=$pkg"     # numeric x.y.z for the .msi and the .app
            echo "DEB_VERSION=$deb"
            echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Archive (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="rustman-${LABEL}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/rustman" README.md README.en.md LICENSE "dist/$name/"
          if [ "$RUNNER_OS" = Linux ]; then
            # Launcher installer for the desktop icon: scripts/install-desktop.sh ./rustman
            mkdir -p "dist/$name/scripts" "dist/$name/assets/logo"
            cp scripts/install-desktop.sh "dist/$name/scripts/"
            cp assets/logo/icon.svg assets/logo/icon-256.png "dist/$name/assets/logo/"
          fi
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "rustman-$env:LABEL-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rustman.exe", README.md, README.en.md, LICENSE -Destination "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"

      - name: Installer (.deb)
        if: matrix.installer == 'deb'
        run: scripts/package-deb.sh "target/${{ matrix.target }}/release/rustman" "$DEB_VERSION" "dist/rustman-${LABEL}-amd64.deb"

      - name: Installer (.dmg)
        if: matrix.installer == 'dmg'
        run: scripts/package-macos.sh "target/${{ matrix.target }}/release/rustman" "$PKG_VERSION" "$BUILD_NUMBER" "dist/rustman-${LABEL}-macos-${{ matrix.arch }}.dmg"

      - name: Installer (.msi)
        if: matrix.installer == 'msi'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build -arch x64 -d "Version=$env:PKG_VERSION" -d "BinDir=target/${{ matrix.target }}/release" -d "RepoDir=$PWD" packaging/windows/rustman.wxs -o "dist/rustman-$env:LABEL-x64.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item dist/*.wixpdb -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: rustman-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Release (tag)
        if: github.ref_type == 'tag'
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Rustman $GITHUB_REF_NAME" --generate-notes
          fi

      - name: Nightly (main)
        if: github.ref == 'refs/heads/main'
        run: |
          # Point the nightly tag at this commit (tags pushed with GITHUB_TOKEN trigger no workflow).
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1 \
            || gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" >/dev/null
          notes="Automatic build of the latest commit on main ([${GITHUB_SHA::7}](https://github.com/$GH_REPO/commit/$GITHUB_SHA)), $(date -u '+%Y-%m-%d %H:%M UTC').

          Not a stable release: it is rebuilt on every push, and the file names stay the same so download links keep working. For stable versions, see the releases tagged v*."
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly dist/* --clobber
            gh release edit nightly --prerelease --latest=false --notes "$notes"
          else
            gh release create nightly dist/* --prerelease --latest=false --title "Nightly" --notes "$notes"
          fi
